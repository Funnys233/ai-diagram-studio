services:
  diagram:
    build: .
    image: ai-diagram-studio:${DIAGRAM_VERSION:-p0}
    restart: unless-stopped
    init: true
    env_file: .env.cloud
    environment:
      APP_MODE: cloud
      HOST: 0.0.0.0
      PORT: 8080
      CLOUD_DATA_DIR: /app/data/cloud
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - cloud-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 2
volumes:
  cloud-data:
